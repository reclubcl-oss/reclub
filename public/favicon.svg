<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Blue circle background -->
  <circle cx="50" cy="50" r="50" fill="#1E44E8"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="white" stroke-width="2.2"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="white" stroke-width="1.4"/>

  <!-- RC Logo group, centered inside the rings -->
  <g fill="white" transform="translate(50,50)">
    <!-- Arrow shaft (vertical, center of R) -->
    <rect x="-13" y="-18" width="6" height="30" rx="1"/>
    <!-- Arrow head (triangle pointing up) -->
    <polygon points="-10,-22 -18,-10 -2,-10"/>

    <!-- R arch (top bump) -->
    <path d="M-7,-16 Q8,-16 8,-8 Q8,0 -7,0 L-7,-5 Q3,-5 3,-8 Q3,-11 -7,-11 Z"/>
    <!-- R leg (diagonal) -->
    <polygon points="-7,0 -7,6 8,22 14,22 -1,6 -1,0"/>

    <!-- C letter -->
    <path d="M22,-14 Q10,-22 4,-12 Q0,-6 0,0 Q0,6 4,12 Q10,22 22,14 L19,8 Q11,16 7,10 Q4,6 4,0 Q4,-6 7,-10 Q11,-16 19,-8 Z"/>
  </g>
</svg>
